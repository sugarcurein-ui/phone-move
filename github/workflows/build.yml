name: build-apk
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create android project
        run: |
          mkdir -p /tmp/keep && cp -r lib pubspec.yaml /tmp/keep/
          flutter create --platforms=android --org com.swamy --project-name phonemove .
          rm -rf lib pubspec.yaml test
          cp -r /tmp/keep/lib ./lib && cp /tmp/keep/pubspec.yaml ./pubspec.yaml

      - name: Patch manifest
        run: python3 tools/patch_android.py

      - run: flutter pub get
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneMove-APK
          path: build/app/outputs/flutter-apk/app-release.apk
